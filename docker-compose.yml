services:
  db:
    image: postgres:17-alpine
    container_name: caja_chambala_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: caja_chambala
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      DB_APP_RW_PASSWORD: ${DB_APP_RW_PASSWORD:?DB_APP_RW_PASSWORD is required}
      DB_APP_RO_PASSWORD: ${DB_APP_RO_PASSWORD:?DB_APP_RO_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caja_chambala"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caja_chambala_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/caja_chambala
      SPRING_DATASOURCE_USERNAME: app_rw
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_RW_PASSWORD:?DB_APP_RW_PASSWORD is required}
      RLS_CONTEXT_HMAC_SECRET_HEX: ${RLS_CONTEXT_HMAC_SECRET_HEX:?RLS_CONTEXT_HMAC_SECRET_HEX is required}
      FLYWAY_URL: jdbc:postgresql://db:5432/caja_chambala
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AES_GCM_ENCRYPTION_KEY: ${AES_GCM_ENCRYPTION_KEY:?AES_GCM_ENCRYPTION_KEY is required}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD is required}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@cajachambala.pe}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caja_chambala_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      BACKEND_INTERNAL_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"

  mailpit:
    image: axllent/mailpit:latest
    container_name: caja_chambala_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Interfaz Web para ver correos
      - "1025:1025" # Servidor SMTP de pruebas

volumes:
  pgdata_v2:
