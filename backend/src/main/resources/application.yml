spring:
  application:
    name: caja-chambala-backend
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/caja_chambala}
    username: ${SPRING_DATASOURCE_USERNAME:app_rw}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_password_rw}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    placeholders:
      rls_context_secret_hex: ${RLS_CONTEXT_HMAC_SECRET_HEX}
    user: ${FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    url: ${FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/caja_chambala}}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: application/json,text/plain,application/xml,text/html,text/xml
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  security:
    rls-context-hmac-secret-hex: ${RLS_CONTEXT_HMAC_SECRET_HEX}
    jwt:
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
    mfa:
      issuer: "Caja Emprende Chambala"
  mail:
    from: ${SMTP_FROM:}
    frontend-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  caja-default-id: "a0000000-0000-0000-0000-000000000001"
