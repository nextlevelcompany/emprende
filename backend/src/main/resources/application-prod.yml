security:
  jwt:
    secret: ${JWT_SECRET}
  crypto:
    secret: ${AES_GCM_ENCRYPTION_KEY}

app:
  security:
    rls-context-hmac-secret-hex: ${RLS_CONTEXT_HMAC_SECRET_HEX}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:*}
  mail:
    from: ${SMTP_FROM}
    frontend-url: ${FRONTEND_BASE_URL}

bootstrap:
  admin:
    password: ${ADMIN_DEFAULT_PASSWORD}

spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    url: ${FLYWAY_URL:${SPRING_DATASOURCE_URL}}
    user: ${FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
    password: ${FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    placeholders:
      rls_context_secret_hex: ${RLS_CONTEXT_HMAC_SECRET_HEX}
