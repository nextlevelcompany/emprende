spring:
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
    url: ${SPRING_DATASOURCE_URL:jdbc:tc:postgresql:17-alpine:///caja_test?TC_TMPFS=/testtmpfs:rw}
    username: ${SPRING_DATASOURCE_USERNAME:test}
    password: ${SPRING_DATASOURCE_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      rls_context_secret_hex: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

security:
  jwt:
    secret: test_jwt_secret_key_at_least_32_bytes_long
  crypto:
    secret: test_aes_key_for_integration_tests_only

app:
  security:
    rls-context-hmac-secret-hex: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

bootstrap:
  admin:
    password: Admin12345678#Chambala

logging:
  level:
    root: WARN
    com.cajachambala: INFO
    org.flywaydb: INFO
