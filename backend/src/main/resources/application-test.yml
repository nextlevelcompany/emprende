spring:
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
    url: ${SPRING_DATASOURCE_URL:jdbc:tc:postgresql:17-alpine:///caja_test?TC_TMPFS=/testtmpfs:rw}
    username: ${SPRING_DATASOURCE_USERNAME:test}
    password: ${SPRING_DATASOURCE_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.cajachambala: INFO
    org.flywaydb: INFO
